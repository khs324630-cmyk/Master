name: Market Alert

on:
  schedule:
    # 미국 장중 (UTC 13:00~21:59, 월~금) 15분마다. 서머타임/표준시 모두 포함
    - cron: "*/15 13-21 * * 1-5"
    # 주말·장외에도 Fear & Greed 확인용으로 하루 2번
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "테스트 알림만 보내기"
        type: boolean
        default: false

concurrency:
  group: market-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
      DROP_THRESHOLD: ${{ vars.DROP_THRESHOLD || '-5' }}
      FNG_THRESHOLD: ${{ vars.FNG_THRESHOLD || '20' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test notification
        if: ${{ inputs.test }}
        run: python alert.py --test

      - name: Restore state
        if: ${{ !inputs.test }}
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Check market
        if: ${{ !inputs.test }}
        run: python alert.py

      - name: Save state
        if: ${{ !inputs.test && always() && hashFiles('state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: alert-state-${{ github.run_id }}
