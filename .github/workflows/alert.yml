name: Market Alert

on:
  schedule:
    # 미국 장중 (UTC 13:00~21:59, 월~금) 15분마다. 서머타임/표준시 모두 포함
    - cron: "*/15 13-21 * * 1-5"
    # 주말·장외에도 Fear & Greed 확인용으로 하루 2번
    - cron: "0 0,12 * * *"
  push:
    branches: [main, master, claude/friendly-fermi-96u8fi]
    paths: ["web/**", "*.py", ".github/workflows/alert.yml"]
  workflow_dispatch:
    inputs:
      test:
        description: "테스트 알림 보내기"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: market-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PUSH_CONFIG: ${{ secrets.PUSH_CONFIG }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
      DROP_THRESHOLD: ${{ vars.DROP_THRESHOLD || '-5' }}
      FNG_THRESHOLD: ${{ vars.FNG_THRESHOLD || '20' }}
      # SEC는 연락처가 담긴 User-Agent를 요구합니다 (기본: GitHub 공개 noreply 주소)
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || format('MarketAlert {0}@users.noreply.github.com', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Check market & notify
        run: python alert.py --out web/data.json ${{ inputs.test && '--test' || '' }}

      - name: Save state
        if: ${{ always() && hashFiles('state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: alert-state-${{ github.run_id }}

      # 웹앱(대시보드) 배포. Settings → Pages → Source를 "GitHub Actions"로 설정해야 합니다.
      - uses: actions/configure-pages@v5
        if: ${{ always() }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ always() }}
        with:
          path: web
      - id: deploy
        if: ${{ always() }}
        uses: actions/deploy-pages@v4
